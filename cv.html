<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniël — CV</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  color:#fff;
  background: radial-gradient(1200px 600px at 10% 10%, rgba(81,35,141,0.55), transparent 8%),
              radial-gradient(900px 500px at 90% 90%, rgba(0,176,255,0.18), transparent 12%),
              linear-gradient(180deg,#0b0325 0%, #071226 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:80px 24px;
  position:relative;
}

.card{
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;
  padding:32px;
  backdrop-filter: blur(10px) saturate(130%);
  max-width:600px;
  text-align:center;
}

h2{
  font-weight:700;
  font-size:24px;
  margin-bottom:16px;
  color:rgba(255,255,255,0.8);
}

.cv-image{
  width:100%;
  max-width:100%;
  border-radius:12px;
  border:1px solid rgba(0,255,128,0.3);
  margin-bottom:16px;
}

/* Download button */
.download-btn{
  display:inline-block;
  padding:10px 18px;
  border-radius:12px;
  border:1px solid rgba(0,255,128,0.7);
  color:#0f0;
  text-decoration:none;
  font-weight:600;
  transition:0.2s;
}
.download-btn:hover{
  background:rgba(0,255,128,0.15);
  box-shadow:0 0 12px #0f0,0 0 24px #0ff;
}

/* Techy Nav */
.tech-nav {
  position: fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:18px;
  padding:12px 20px;
  background: rgba(0,0,0,0.4);
  border:1px solid rgba(0,255,128,0.7);
  border-radius:12px;
  backdrop-filter: blur(8px);
  z-index:1000;
  font-family:'Inter',sans-serif;
  transition: top 0.3s;
}
.tech-nav a {
  color:#0f0;
  text-decoration:none;
  font-weight:600;
  transition:0.2s;
  position:relative;
}
.tech-nav a::after {
  content:'';
  position:absolute;
  bottom:-4px;
  left:0;
  width:0;
  height:2px;
  background:linear-gradient(90deg,#0f0,#0ff);
  transition: width 0.2s;
}
.tech-nav a:hover::after {width:100%;}
.tech-nav a:hover {color:#0f0; text-shadow:0 0 8px #0f0,0 0 16px #0ff;}
</style>
</head>
<body>
<nav class="tech-nav" id="navbar">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="cv.html">CV</a>
  <a href="skills.html">Skills</a>
  <a href="projects.html">Projects</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="card">
  <h2>Resume</h2>
  <!-- Replace the src with your CV image file -->
  <img src="Daniël CV.jpg" alt="Daniël CV" class="cv-image">
  
  <!-- Download button -->
  <a href="Daniël CV.pdf" download="Daniel_CV" class="download-btn">Download CV</a>
</div>

<script>
let prevScrollPos = window.pageYOffset;
const navbar = document.getElementById("navbar");
window.onscroll = function() {
  let currentScrollPos = window.pageYOffset;
  navbar.style.top = (prevScrollPos > currentScrollPos) ? "20px" : "-80px";
  prevScrollPos = currentScrollPos;
};
</script>
</body>
</html>
